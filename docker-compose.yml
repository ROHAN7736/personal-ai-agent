services:
  agent-api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"   # local only; remove 127.0.0.1 to expose on your network
    environment:
      PROVIDER: ${PROVIDER:-ollama}
      MODEL: ${MODEL:-}
      OLLAMA_URL: http://host.docker.internal:11434/v1
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_DB: /app/data/agent.db
      AGENT_LOG: /app/data/agent.log
    volumes:
      - ./data:/app/data
      - ./files:/app/files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
